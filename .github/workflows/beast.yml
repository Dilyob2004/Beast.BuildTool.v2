# Beast BuildTool CI: Windows, Linux (with an APK built on Linux) and macOS.
name: Beast BuildTool

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tool (Build.bat)
        run: cmd /c Build.bat
      - name: InstallDotnet.ps1
        run: |
          ./InstallDotnet.ps1 -Dir "$env:RUNNER_TEMP\dotnet10" -Force -NoPath
          $sdks = & "$env:RUNNER_TEMP\dotnet10\dotnet.exe" --list-sdks
          if (-not ($sdks -match '^10\.')) { throw "no .NET 10 SDK: $sdks" }
      - name: BuildGraphTests
        run: dotnet run --project Tests/BuildGraphTests/BuildGraphTests.csproj -c Release
      - name: ModelTests
        run: dotnet run --project Tests/ModelTests/ModelTests.csproj -c Release
      - name: Smoke
        run: ./Tests/Smoke.ps1
      - name: Targets
        run: ./Tests/Targets.ps1
      - name: CompilationModes
        run: ./Tests/CompilationModes.ps1
      - name: Features
        run: ./Tests/Features.ps1 -SkipPackages
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-generated
          path: Tests/Generated
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Toolchain
        # Clang 18 with lld (ThinLTO) and the sanitizer runtimes; GCC 13; CMake and pkg-config;
        # the arm64 cross compiler and qemu-user for the Linux arm64 group.
        run: sudo apt-get update && sudo apt-get install -y clang lld libclang-rt-18-dev g++ cmake pkg-config unzip g++-aarch64-linux-gnu qemu-user libc++-18-dev libc++abi-18-dev
      - name: Build tool (Build.sh)
        run: bash Build.sh
      - name: InstallDotnet.sh
        run: |
          bash InstallDotnet.sh --dir "$RUNNER_TEMP/dotnet10" --force --no-profile
          "$RUNNER_TEMP/dotnet10/dotnet" --list-sdks | grep -q '^10\.'
      - name: BuildGraphTests
        run: dotnet run --project Tests/BuildGraphTests/BuildGraphTests.csproj -c Release
      - name: ModelTests
        run: dotnet run --project Tests/ModelTests/ModelTests.csproj -c Release
      - name: Linux and Android (APK built on Linux)
        # The runner image provides ANDROID_HOME and ANDROID_NDK_LATEST_HOME.
        run: bash Tests/Unix.sh --android
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-generated
          path: Tests/Generated
          if-no-files-found: ignore

  android:
    # An x86_64 emulator with KVM: the template APK is installed and started, native tests run on it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build tool
        run: dotnet build BuildTool/Beast.BuildTool.csproj -c Release
      - name: Emulator, run and test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash Tests/AndroidDevice.sh
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-generated
          path: Tests/Generated
          if-no-files-found: ignore

  android-install:
    # InstallAndroid.sh / InstallAndroid.ps1 into $RUNNER_TEMP (JDK 17, command-line tools, SDK packages,
    # NDK; on Linux also the emulator, a system image and AVD beast_api34), a second run that must not
    # download anything, then the 'new' template APK built with exactly these paths.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tool
        run: dotnet build BuildTool/Beast.BuildTool.csproj -c Release
      - name: InstallAndroid.sh
        if: runner.os != 'Windows'
        run: |
          unset JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT
          extra=(); [[ "$RUNNER_OS" == Linux ]] && extra=(--emulator)
          bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --force --no-profile "${extra[@]}"
          set -o pipefail
          bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --no-profile "${extra[@]}" | tee "$RUNNER_TEMP/second.log"
          if grep -E "Downloading|Installing:|AVD created" "$RUNNER_TEMP/second.log"; then echo "::error title=InstallAndroid.sh::the second run downloaded again"; exit 1; fi
      - name: InstallAndroid.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:JAVA_HOME, Env:ANDROID_HOME, Env:ANDROID_SDK_ROOT -ErrorAction SilentlyContinue
          ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -Force -NoProfile
          $second = ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -NoProfile *>&1 | Out-String
          Write-Host $second
          if ($second -match 'Downloading|Installing:') { Write-Host '::error title=InstallAndroid.ps1::the second run downloaded again'; exit 1 }
      - name: Build the Android template with the installed toolchain
        run: |
          trap 'echo "::error title=android-install::$BASH_COMMAND failed (line $LINENO)"' ERR
          tool=BuildTool/bin/Beast.BuildTool; [[ "$RUNNER_OS" == Windows ]] && tool=BuildTool/bin/Beast.BuildTool.exe
          jdk="$RUNNER_TEMP/jdk"; [[ "$RUNNER_OS" == macOS ]] && jdk="$jdk/Contents/Home"
          "$tool" new Droid --path "$RUNNER_TEMP/projects"
          py="$(command -v python3 || command -v python)"
          "$py" - "$RUNNER_TEMP/projects/Droid/Config/BuildConfig.json" "$RUNNER_TEMP/android" "$jdk" <<'EOF'
          import json, os, sys
          path, sdk, jdk = sys.argv[1:]
          c = json.load(open(path))
          c["android"].update({"sdkRoot": sdk, "ndkRoot": os.path.join(sdk, "ndk"), "javaHome": jdk, "abis": ["x86_64"]})
          json.dump(c, open(path, "w"), indent=2)
          EOF
          # One retry: Maven Central sometimes answers 403 to a runner while Gradle resolves the Android plugin.
          if ! "$tool" build "$RUNNER_TEMP/projects/Droid" --platform Android --config Debug >"$RUNNER_TEMP/build.log" 2>&1 &&
             { sleep 30; ! "$tool" build "$RUNNER_TEMP/projects/Droid" --platform Android --config Debug >"$RUNNER_TEMP/build.log" 2>&1; }; then
            cat "$RUNNER_TEMP/build.log"
            tail -n 30 "$RUNNER_TEMP/build.log" | grep -v ' Verbose ' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=android-install build::/'; echo
            exit 1
          fi
          test -f "$RUNNER_TEMP/projects/Droid/Binaries/Android/Debug/Droid.apk"
          if [[ "$RUNNER_OS" == Linux ]]; then
            JAVA_HOME="$jdk" ANDROID_HOME="$RUNNER_TEMP/android" ANDROID_SDK_ROOT="$RUNNER_TEMP/android" "$RUNNER_TEMP/android/cmdline-tools/latest/bin/avdmanager" list avd >"$RUNNER_TEMP/avds.txt" 2>&1 || true
            cat "$RUNNER_TEMP/avds.txt"; ls -la ~/.android/avd 2>&1 || true
            if ! grep -q "Name: beast_api34" "$RUNNER_TEMP/avds.txt"; then
              echo "::error title=android-install::AVD beast_api34 not listed: $(tr '\n' ' ' <"$RUNNER_TEMP/avds.txt" | head -c 1500) | avd dir: $(ls ~/.android/avd 2>&1 | tr '\n' ' ') | env: $(env | grep -i 'android' | tr '\n' ' ') | ini: $(cat ~/.android/avd/beast_api34.ini | tr '\n' ' ') | config: $(grep -E 'image|abi|target|tag' ~/.android/avd/beast_api34.avd/config.ini | tr '\n' ' ') | sysdir: $(ls "$RUNNER_TEMP/android/system-images/android-34/google_apis/x86_64" 2>&1 | tr '\n' ' ')"
              exit 1
            fi
          fi
          echo "::notice title=InstallAndroid ($RUNNER_OS)::toolchain installed; template APK built"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tool (Build.sh)
        run: bash Build.sh
      - name: InstallDotnet.sh
        run: |
          bash InstallDotnet.sh --dir "$RUNNER_TEMP/dotnet10" --force --no-profile
          "$RUNNER_TEMP/dotnet10/dotnet" --list-sdks | grep -q '^10\.'
      - name: BuildGraphTests
        run: dotnet run --project Tests/BuildGraphTests/BuildGraphTests.csproj -c Release
      - name: ModelTests
        run: dotnet run --project Tests/ModelTests/ModelTests.csproj -c Release
      - name: macOS (Apple clang)
        run: bash Tests/Unix.sh
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-generated
          path: Tests/Generated
          if-no-files-found: ignore

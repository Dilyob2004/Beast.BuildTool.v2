# Beast BuildTool CI: Windows, Linux (with an APK built on Linux) and macOS.
name: Beast BuildTool

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tool (Build.bat)
        run: cmd /c Build.bat
      - name: InstallDotnet.ps1
        run: |
          ./InstallDotnet.ps1 -Dir "$env:RUNNER_TEMP\dotnet10" -Force -NoPath
          $sdks = & "$env:RUNNER_TEMP\dotnet10\dotnet.exe" --list-sdks
          if (-not ($sdks -match '^10\.')) { throw "no .NET 10 SDK: $sdks" }
      - name: BuildGraphTests
        run: dotnet run --project Tests/BuildGraphTests/BuildGraphTests.csproj -c Release
      - name: ModelTests
        run: dotnet run --project Tests/ModelTests/ModelTests.csproj -c Release
      - name: Smoke
        run: ./Tests/Smoke.ps1
      - name: Targets
        run: ./Tests/Targets.ps1
      - name: CompilationModes
        run: ./Tests/CompilationModes.ps1
      - name: Features
        run: ./Tests/Features.ps1 -SkipPackages
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-generated
          path: Tests/Generated
          if-no-files-found: ignore

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Toolchain
        # Clang 18 with lld (ThinLTO) and the sanitizer runtimes; GCC 13; CMake and pkg-config;
        # the arm64 cross compiler and qemu-user for the Linux arm64 group.
        run: sudo apt-get update && sudo apt-get install -y clang lld libclang-rt-18-dev g++ cmake pkg-config unzip g++-aarch64-linux-gnu qemu-user libc++-18-dev libc++abi-18-dev
      - name: Build tool (Build.sh)
        run: bash Build.sh
      - name: InstallDotnet.sh
        run: |
          bash InstallDotnet.sh --dir "$RUNNER_TEMP/dotnet10" --force --no-profile
          "$RUNNER_TEMP/dotnet10/dotnet" --list-sdks | grep -q '^10\.'
      - name: BuildGraphTests
        run: dotnet run --project Tests/BuildGraphTests/BuildGraphTests.csproj -c Release
      - name: ModelTests
        run: dotnet run --project Tests/ModelTests/ModelTests.csproj -c Release
      - name: Linux and Android (APK built on Linux)
        # The runner image provides ANDROID_HOME and ANDROID_NDK_LATEST_HOME.
        run: bash Tests/Unix.sh --android
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-generated
          path: Tests/Generated
          if-no-files-found: ignore

  android:
    # An x86_64 emulator with KVM: the template APK is installed and started, native tests run on it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build tool
        run: dotnet build BuildTool/Beast.BuildTool.csproj -c Release
      - name: Emulator, run and test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash Tests/AndroidDevice.sh
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-generated
          path: Tests/Generated
          if-no-files-found: ignore

  android-install:
    # InstallAndroid.sh / InstallAndroid.ps1 into $RUNNER_TEMP (JDK 17, command-line tools, SDK packages,
    # NDK; on Linux also the emulator, a system image and AVD beast_api34), a second run that must not
    # download anything, then the 'new' template APK built with exactly these paths.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tool
        run: dotnet build BuildTool/Beast.BuildTool.csproj -c Release
      - name: InstallAndroid.sh
        if: runner.os != 'Windows'
        run: |
          unset JAVA_HOME ANDROID_HOME ANDROID_SDK_ROOT
          set -o pipefail
          extra=(); [[ "$RUNNER_OS" == Linux ]] && extra=(--emulator)
          bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --force --no-profile "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/first.log"
          bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --no-profile "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/second.log"
          if grep -E "Downloading|Installing:|AVD created" "$RUNNER_TEMP/second.log"; then
            echo "::error title=InstallAndroid.sh::the second run downloaded again: $(grep -E 'Downloading|Installing:|AVD created|Already' "$RUNNER_TEMP/second.log" | tr '\n' ' ' | head -c 1500)"; exit 1
          fi
          # The pinned sdkmanager works on its own: no Android CLI, no usage metrics, no deprecation warnings.
          if grep -iE "deprecat|Android CLI|metrics|no longer needed" "$RUNNER_TEMP/first.log" "$RUNNER_TEMP/second.log"; then
            echo "::error title=InstallAndroid.sh::deprecation/Android CLI/metrics message in the output"; exit 1
          fi
          if [[ -e "$HOME/.androidrc" ]] || ls "$RUNNER_TEMP/android" | grep -qix 'android'; then echo "::error title=InstallAndroid.sh::Android CLI was set up"; exit 1; fi
          # Network failures: a removed package comes back although the first sdkmanager attempt fails
          # (an unreachable proxy); when every attempt fails the script stops and names dl.google.com.
          rm -rf "$RUNNER_TEMP/android/platforms/android-35"
          BEAST_INSTALL_ANDROID_FAIL_ATTEMPTS=1 bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --no-profile 2>&1 | tee "$RUNNER_TEMP/retry.log"
          if ! grep -q "retrying in 5 s" "$RUNNER_TEMP/retry.log" || ! grep -q "attempt 2 of 3" "$RUNNER_TEMP/retry.log" || [[ ! -f "$RUNNER_TEMP/android/platforms/android-35/android.jar" ]]; then
            echo "::error title=InstallAndroid.sh::no retry after a failed sdkmanager attempt"; exit 1
          fi
          rm -rf "$RUNNER_TEMP/android/platforms/android-35"
          if BEAST_INSTALL_ANDROID_FAIL_ATTEMPTS=3 bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --no-profile >"$RUNNER_TEMP/fail.log" 2>&1; then
            echo "::error title=InstallAndroid.sh::three failed attempts did not fail the script"; exit 1
          fi
          grep -q "after 3 attempts" "$RUNNER_TEMP/fail.log" && grep -q "check the connection to dl.google.com" "$RUNNER_TEMP/fail.log" ||
            { echo "::error title=InstallAndroid.sh::no network hint: $(tail -n 5 "$RUNNER_TEMP/fail.log" | tr '\n' ' ')"; exit 1; }
          bash InstallAndroid.sh --dir "$RUNNER_TEMP/android" --jdk-dir "$RUNNER_TEMP/jdk" --no-profile >/dev/null
          version="$(JAVA_HOME="$RUNNER_TEMP/jdk$([[ "$RUNNER_OS" == macOS ]] && echo /Contents/Home)" "$RUNNER_TEMP/android/cmdline-tools/19.0/bin/sdkmanager" --version)"
          [[ "$version" == 19.0* ]] || { echo "::error title=InstallAndroid.sh::sdkmanager --version: $version"; exit 1; }
      - name: InstallAndroid.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:JAVA_HOME, Env:ANDROID_HOME, Env:ANDROID_SDK_ROOT -ErrorAction SilentlyContinue
          $first = ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -Force -NoProfile *>&1 | Out-String
          Write-Host $first
          if (-not (Test-Path "$env:RUNNER_TEMP\android\ndk\27.3.13750724\source.properties")) { Write-Host '::error title=InstallAndroid.ps1::the first run did not install the NDK'; exit 1 }
          $second = ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -NoProfile *>&1 | Out-String
          Write-Host $second
          if ($second -match 'Downloading|Installing:') { Write-Host '::error title=InstallAndroid.ps1::the second run downloaded again'; exit 1 }
          # The pinned sdkmanager works on its own: no Android CLI, no usage metrics, no deprecation warnings.
          if ("$first$second" -match '(?i)deprecat|Android CLI|metrics|no longer needed') { Write-Host "::error title=InstallAndroid.ps1::deprecation/Android CLI/metrics message: $($Matches[0])"; exit 1 }
          if ((Test-Path "$env:USERPROFILE\.androidrc") -or (Test-Path "$env:RUNNER_TEMP\android\android.exe")) { Write-Host '::error title=InstallAndroid.ps1::Android CLI was set up'; exit 1 }
          # Network failures: a removed package comes back although the first sdkmanager attempt fails
          # (an unreachable proxy); when every attempt fails the script stops and names dl.google.com.
          $platform = "$env:RUNNER_TEMP\android\platforms\android-35"
          Remove-Item -Recurse -Force $platform
          $env:BEAST_INSTALL_ANDROID_FAIL_ATTEMPTS = '1'
          $retry = ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -NoProfile *>&1 | Out-String
          Write-Host $retry
          if (($retry -notmatch 'retrying in 5 s') -or ($retry -notmatch 'attempt 2 of 3') -or -not (Test-Path "$platform\android.jar")) { Write-Host '::error title=InstallAndroid.ps1::no retry after a failed sdkmanager attempt'; exit 1 }
          Remove-Item -Recurse -Force $platform
          $env:BEAST_INSTALL_ANDROID_FAIL_ATTEMPTS = '3'
          $failed = $false
          try { $fail = ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -NoProfile *>&1 | Out-String } catch { $failed = $true; $fail = "$_" }
          Write-Host $fail
          if (-not $failed -and $LASTEXITCODE -eq 0) { Write-Host '::error title=InstallAndroid.ps1::three failed attempts did not fail the script'; exit 1 }
          if (($fail -notmatch 'after 3 attempts') -or ($fail -notmatch 'check the connection to dl\.google\.com')) { Write-Host '::error title=InstallAndroid.ps1::no network hint'; exit 1 }
          Remove-Item Env:BEAST_INSTALL_ANDROID_FAIL_ATTEMPTS
          ./InstallAndroid.ps1 -Dir "$env:RUNNER_TEMP\android" -JdkDir "$env:RUNNER_TEMP\jdk" -NoProfile | Out-Null
          $env:JAVA_HOME = "$env:RUNNER_TEMP\jdk"
          $version = (& "$env:RUNNER_TEMP\android\cmdline-tools\19.0\bin\sdkmanager.bat" --version | Out-String).Trim()
          if (-not $version.StartsWith('19.0')) { Write-Host "::error title=InstallAndroid.ps1::sdkmanager --version: $version"; exit 1 }
      - name: Build the Android template with the installed toolchain
        run: |
          trap 'echo "::error title=android-install::$BASH_COMMAND failed (line $LINENO)"' ERR
          tool=BuildTool/bin/Beast.BuildTool; [[ "$RUNNER_OS" == Windows ]] && tool=BuildTool/bin/Beast.BuildTool.exe
          jdk="$RUNNER_TEMP/jdk"; [[ "$RUNNER_OS" == macOS ]] && jdk="$jdk/Contents/Home"
          "$tool" new Droid --path "$RUNNER_TEMP/projects"
          py="$(command -v python3 || command -v python)"
          "$py" - "$RUNNER_TEMP/projects/Droid/Config/BuildConfig.json" "$RUNNER_TEMP/android" "$jdk" <<'EOF'
          import json, os, sys
          path, sdk, jdk = sys.argv[1:]
          c = json.load(open(path))
          c["android"].update({"sdkRoot": sdk, "ndkRoot": os.path.join(sdk, "ndk"), "javaHome": jdk, "abis": ["x86_64"]})
          json.dump(c, open(path, "w"), indent=2)
          EOF
          # One retry: Maven Central sometimes answers 403 to a runner while Gradle resolves the Android plugin.
          if ! "$tool" build "$RUNNER_TEMP/projects/Droid" --platform Android --config Debug >"$RUNNER_TEMP/build.log" 2>&1 &&
             { sleep 30; ! "$tool" build "$RUNNER_TEMP/projects/Droid" --platform Android --config Debug >"$RUNNER_TEMP/build.log" 2>&1; }; then
            cat "$RUNNER_TEMP/build.log"
            tail -n 30 "$RUNNER_TEMP/build.log" | grep -v ' Verbose ' | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=android-install build::/'; echo
            exit 1
          fi
          test -f "$RUNNER_TEMP/projects/Droid/Binaries/Android/Debug/Droid.apk"
          if [[ "$RUNNER_OS" == Linux ]]; then
            # The AVD as 'run --avd beast_api34' starts it: the emulator's own list.
            export ANDROID_HOME="$RUNNER_TEMP/android" ANDROID_SDK_ROOT="$RUNNER_TEMP/android" JAVA_HOME="$jdk" ANDROID_AVD_HOME="$HOME/.android/avd"
            "$ANDROID_HOME/emulator/emulator" -list-avds >"$RUNNER_TEMP/emulator-avds.txt" 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/19.0/bin/avdmanager" list avd -c >"$RUNNER_TEMP/avds.txt" 2>&1 || true
            echo "::notice title=android-install AVDs::avdmanager: $(tr '\n' ' ' <"$RUNNER_TEMP/avds.txt" | head -c 500) | emulator -list-avds: $(tr '\n' ' ' <"$RUNNER_TEMP/emulator-avds.txt" | head -c 500)"
            grep -qx beast_api34 "$RUNNER_TEMP/emulator-avds.txt" || { echo "::error title=android-install::the emulator does not list beast_api34"; exit 1; }
          fi
          echo "::notice title=InstallAndroid ($RUNNER_OS)::toolchain installed; template APK built"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build tool (Build.sh)
        run: bash Build.sh
      - name: InstallDotnet.sh
        run: |
          bash InstallDotnet.sh --dir "$RUNNER_TEMP/dotnet10" --force --no-profile
          "$RUNNER_TEMP/dotnet10/dotnet" --list-sdks | grep -q '^10\.'
      - name: BuildGraphTests
        run: dotnet run --project Tests/BuildGraphTests/BuildGraphTests.csproj -c Release
      - name: ModelTests
        run: dotnet run --project Tests/ModelTests/ModelTests.csproj -c Release
      - name: macOS (Apple clang)
        run: bash Tests/Unix.sh
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-generated
          path: Tests/Generated
          if-no-files-found: ignore
